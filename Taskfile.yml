---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

dotenv: ['.env']

vars:
  RED: "\\033[0;31m"
  GREEN: "\\033[0;32m"
  PPL: "\\033[0;35m"
  NC: "\\033[0m"
  VOLUME: ""
  PROFILE: ""
  DOCKER_USER: namichel

tasks:
  default:
    desc: List all tasks
    cmds:
      - task --list
    silent: true

# ──────────────────────────────────────────
# SETUP
# ──────────────────────────────────────────
  keygen:
    desc: Create melange key for build image
    cmds:
      - |
        echo -e "{{ .PPL }}Melange key generation...{{ .NC }}"
        cd melange && melange keygen
    silent: true

  pipeline:
    desc: Fetch pipeline repo of WolfiOS
    cmds:
      - |
        git clone --depth 1 --filter=blob:none --sparse https://github.com/wolfi-dev/os.git /tmp/wolfi-os &&
        cd /tmp/wolfi-os && git sparse-checkout set pipelines && git checkout &&
        cp -r pipelines {{.ROOT_DIR}}/melange/
        rm -rf /tmp/wolfi-os

# ──────────────────────────────────────────
# TERRAFORM
# ──────────────────────────────────────────
  tf:fmt:
    desc: Terraform fmt
    cmds:
      - |
        echo -e "{{ .PPL }}Process terraform fmt...{{ .NC }}"
        cd terraform && terraform fmt
    silent: true
  tf:init:
    desc: Terraform init
    cmds:
      - |
        echo -e "{{ .PPL }}Process terraform init...{{ .NC }}"
        cd terraform && terraform init
    silent: true
  tf:plan:
    desc: Terraform plan
    cmds:
      - |
        echo -e "{{ .PPL }}Process terraform plan...{{ .NC }}"
        cd terraform && terraform plan
    silent: true
  tf:apply:
    desc: Terraform apply
    cmds:
      - |
        echo -e "{{ .PPL }}Process terraform apply...{{ .NC }}"
        cd terraform && terraform apply
    silent: true
  tf:output:
    desc: Terraform output
    cmds:
      - |
        echo -e "{{ .PPL }}Process terraform output...{{ .NC }}"
        cd terraform && terraform output
    silent: true
  tf:down:
    desc: Terraform destroy
    cmds:
      - |
        echo -e "{{ .PPL }}Process terraform destroy...{{ .NC }}"
        cd terraform && terraform destroy
      - |
        echo -e "{{ .PPL }}Rm inventory...{{ .NC }}"
        rm -f ansible/inventory/inventory.ini
    silent: true
  tf:show:
    desc: Terraform show
    cmds:
      - |
        echo -e "{{ .PPL }}Process terraform show...{{ .NC }}"
        cd terraform && terraform show
    silent: true
  tf:tfvars:
    desc: Create a terraform.tfvars
    cmds:
      - bash scripts/tfvars.sh
    silent: true
  # ──────────────────────────────────────────
  # ANSIBLE
  # ──────────────────────────────────────────
  ansible:help:
    desc: Ansible tasks
    cmds:
      - |
        echo -e "{{ .PPL }}Ansible tasks{{ .NC }}"
        echo -e "{{ .PPL }Run: task ansible:test{{ .NC }}"


  ansible:lint:
    desc: Ansible lint
    cmds:
      - ansible-lint .
    silent: true

  ansible:test:
    desc: "Ansible Molecule Tests for a specific roles or all of them. Usage: task ansible:test [role=wordpress]"
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        if [ -n "{{ .role }}" ]; then
          if [ -d "ansible/roles/{{ .role }}/molecule/default" ]; then
            echo -e "{{ .PPL }}Running Molecule test for role: {{ .role }}{{ .NC }}"
            cd ansible/roles/{{.role}} && molecule destroy && molecule test
          else
            echo -e "{{ .PPL }}Role {{ .role }} not found{{ .NC }}"
            exit 1
          fi
        else
          echo -e "{{ .PPL }}Running tests for all roles{{ .NC }}"
          for role_dir in ansible/roles/*; do
            echo -e "{{.role_dir}}"
            if [ -d "$role_dir/molecule/default" ]; then
              echo -e "{{.PPL}}Testing role: $(basename $role_dir){{.NC}}"
              (cd "$role_dir" && molecule destroy && molecule test)
            fi
          done
        fi
    silent: true

  ansible:play:
    desc: "Launch Ansible site playbook"
    dir: "{{.TASKFILE_DIR}}/ansible"
    cmds:
      - ANSIBLE_CONFIG=../ansible.cfg ansible-playbook -i inventory/inventory.ini site.yml --vault-id cloudone@{{.TASKFILE_DIR}}/.vault_pass_cloudone
        --diff

  ansible:wordpress:
    desc: "Run ONLY the wordpress role tasks"
    dir: "{{.TASKFILE_DIR}}/ansible"
    cmds:
      - ansible-playbook -i inventory/inventory.ini site.yml --vault-id cloudone@{{.TASKFILE_DIR}}/.vault_pass_cloudone
        --tags wordpress --diff

  ansible:boot:
    desc: "Run ONLY the wordpress role tasks"
    dir: "{{.TASKFILE_DIR}}/ansible"
    cmds:
      - ansible-playbook -i inventory/inventory.ini site.yml --vault-id cloudone@{{.TASKFILE_DIR}}/.vault_pass_cloudone
        --tags bootstrap --diff

  ansible:docker:
    desc: "Run ONLY the wordpress role tasks"
    dir: "{{.TASKFILE_DIR}}/ansible"
    cmds:
      - ansible-playbook -i inventory/inventory.ini site.yml --vault-id cloudone@{{.TASKFILE_DIR}}/.vault_pass_cloudone
        --tags docker --diff

  ansible:angie_lb:
    desc: "Run ONLY the angie_lb role tasks"
    dir: "{{.TASKFILE_DIR}}/ansible"
    cmds:
      - ansible-playbook -i inventory/inventory.ini site.yml --vault-id cloudone@{{.TASKFILE_DIR}}/.vault_pass_cloudone
        --tags angie_lb --diff

  ansible:tag:
    desc: "Run a specific tag"
    dir: "{{.TASKFILE_DIR}}/ansible"
    vars:
      TAG: '{{.TAG | default "wordpress_setup"}}'
    cmds:
      - ansible-playbook -i inventory/inventory.ini site.yml --vault-id cloudone@{{.TASKFILE_DIR}}/.vault_pass_cloudone -e wordpress_force_setup=true --tags {{.TAG}}


  # ──────────────────────────────────────────
  # DOCKER COMPOSE
  # ──────────────────────────────────────────
  compose:help:
    desc: Some exemples
    cmds:
      - |
        echo -e "{{ .PPL }}WORKFLOW EXEMPLE{{ .NC }}"
        echo -e "{{ .PPL }}Run: task compose:up PROFILE=monitoring for grafana and prometheus{{ .NC }}"
        echo -e "{{ .PPL }}Run: task compose:down PROFILE=monitoring VOLUME=true to add -v{{ .NC }}"
    silent: true
  compose:up:
    desc: Up the docker compose in local
    cmds:
      - |
        echo -e "{{ .PPL }}Process compose up...{{ .NC }}"
        cd compose && docker compose {{if .PROFILE}}--profile {{.PROFILE}}{{end}} up -d
    silent: true
  compose:down:
    desc: down the docker compose in local
    cmds:
      - |
        echo -e "{{ .PPL }}Process compose down...{{ .NC }}"
        cd compose && docker compose {{if .PROFILE}}--profile {{.PROFILE}}{{end}} down {{if .VOLUME}}-v{{end}}
    silent: true

# ──────────────────────────────────────────
# CI
# ──────────────────────────────────────────

  act:
    desc: run CI script locally (checkov fail)
    cmds:
      - |
        act --platform ubuntu-latest=catthehacker/ubuntu:act-latest --secret-file .secrets

  checkov:
    desc: run checkov
    cmds:
      - >-
        checkov -d . --output cli
        --quiet
        --output junitxml
        --output-file-path console,results_junitxml.xml
        --soft-fail

# ──────────────────────────────────────────
# MELANGE
# ──────────────────────────────────────────

  melange:
    desc: build apk package service
    internal: true
    dir: melange/{{.SERVICE}}
    vars:
      SERVICE: '{{.SERVICE}}'
    cmds:
      - rm -rf ../packages/{{.ARCH | default "x86_64"}}/*
      - >
        docker run --rm 
        -v {{.USER_WORKING_DIR}}/melange:/work 
        -w /work/{{.SERVICE}} 
        --privileged 
        cgr.dev/chainguard/melange build {{.SERVICE}}.yaml 
        --arch amd64 
        --signing-key ../melange.rsa 
        --pipeline-dir /work/pipelines
        --out-dir /work/packages

  melange:angie:
    cmds:
      - task: melange
        vars: { SERVICE: angie }

  melange:wp-cli:
    cmds:
      - task: melange
        vars: { SERVICE: wp-cli }

  melange:phpmyadmin:
    cmds:
      - task: melange
        vars: { SERVICE: phpmyadmin }

  melange:mariadb:
    cmds:
      - task: melange
        vars: { SERVICE: mariadb }

  melange:wordpress:
    cmds:
      - task: melange
        vars: { SERVICE: wordpress }

  melange:step-ca:
    cmds:
      - task: melange
        vars: { SERVICE: step-ca }
# ──────────────────────────────────────────
# APKO
# ──────────────────────────────────────────

  apko:
    desc: apko build the service
    internal: true
    dir: melange/{{.SERVICE}}
    vars:
      SERVICE: '{{.SERVICE}}'
      TAG: '{{.TAG | default "latest"}}'
    cmds:
      - >
        docker run --rm 
        -v {{.USER_WORKING_DIR}}/melange:/work 
        -w /work/{{.SERVICE}} 
        cgr.dev/chainguard/apko build apko.yaml 
        {{.SERVICE}}:{{.TAG}} 
        {{.SERVICE}}.tar 
      - docker load < {{.USER_WORKING_DIR}}/melange/{{.SERVICE}}/{{.SERVICE}}.tar

  apko:angie:
    cmds:
      - task: apko
        vars: { SERVICE: angie }

  apko:phpmyadmin:
    cmds:
      - task: apko
        vars: { SERVICE: phpmyadmin }

  apko:mariadb:
    cmds:
      - task: apko
        vars: { SERVICE: mariadb }

  apko:wordpress:
    cmds:
      - task: apko
        vars: { SERVICE: wordpress }

  apko:step-ca:
    cmds:
      - task: apko
        vars: { SERVICE: step-ca }

# ──────────────────────────────────────────
# DOCKER
# ──────────────────────────────────────────
  docker:login:
    desc: Login to dockerhub
    cmds:
      - docker login -u {{ .DOCKER_USER }}

  push:
    internal: true
    cmds:
      - docker tag {{.SERVICE}}:{{.TAG}}-amd64 {{.DOCKER_USER}}/{{.SERVICE}}:{{.TAG}}-amd64
      - docker push {{.DOCKER_USER}}/{{.SERVICE}}:{{.TAG}}-amd64

  push:angie:
    cmds:
      - task: push
        vars: { SERVICE: angie, TAG: '{{.TAG}}' }

  push:mariadb:
    cmds:
      - task: push
        vars: { SERVICE: mariadb, TAG: '{{.TAG}}' }

  push:wordpress:
    cmds:
      - task: push
        vars: { SERVICE: wordpress, TAG: '{{.TAG}}' }

  push:phpmyadmin:
    cmds:
      - task: push
        vars: { SERVICE: phpmyadmin, TAG: '{{.TAG}}' }

  push:step-ca:
    cmds:
      - task: push
        vars: { SERVICE: step-ca, TAG: '{{.TAG}}' }

  push:all:
    cmds:
      - task: push:angie
      - task: push:mariadb
      - task: push:wordpress
      - task: push:phpmyadmin
      - task: push:step-ca

# ──────────────────────────────────────────
# DEPLOY
# ──────────────────────────────────────────

  deploy:
    desc: "Full deploy: Terraform → Ansible"
    cmds:
      - task: tf:init
      - task: tf:tfvars
      - task: tf:apply
      - cmd: |
          echo "Waiting 30s for instances to be ready..."
          sleep 30
      - task: ansible:play
