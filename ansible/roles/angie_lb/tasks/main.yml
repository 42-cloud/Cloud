---
# angie_lb - tasks/main.yml

- name: Set UFW default forward policy to ACCEPT
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: ^DEFAULT_FORWARD_POLICY=
    line: DEFAULT_FORWARD_POLICY="ACCEPT"

- name: Reload UFW
  community.general.ufw:
    state: reloaded

# ici: dire au kernel de ne pas drop les paquets qui ne lui sont pas destine.
# source_dest_check=false n'est pas suffisant cote AWS — il faut aussi le faire cote OS.
- name: Enable IP forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true

# je remplace l'IP des backends par celle du LB — les backends n'ont pas d'IP publique.
- name: Enable NAT masquerade
  ansible.builtin.iptables:
    table: nat
    chain: POSTROUTING
    out_interface: ens5
    jump: MASQUERADE

# test ACME
- name: MASQUERADE step-ca outbound to backends (ACME http-01 callback)
  ansible.builtin.iptables:
    table: nat
    chain: POSTROUTING
    source: "172.18.0.0/16"
    destination: "10.0.2.0/24"
    out_interface: ens5
    jump: MASQUERADE

- name: Allow FORWARD from Docker bridge to backends (ACME http-01)
  ansible.builtin.iptables:
    chain: FORWARD
    source: "172.18.0.0/16"
    destination: "10.0.2.0/24"
    jump: ACCEPT

- name: Allow FORWARD return from backends to Docker bridge
  ansible.builtin.iptables:
    chain: FORWARD
    source: "10.0.2.0/24"
    destination: "172.18.0.0/16"
    ctstate: [ESTABLISHED, RELATED]
    jump: ACCEPT

# UFW a une policy DROP sur FORWARD on accepte le trafic sortant des backends.
- name: Allow FORWARD for VPC traffic outbound
  ansible.builtin.iptables:
    chain: FORWARD
    source: 10.0.0.0/16
    jump: ACCEPT

# Meme chose dans l'autre sens on accepte uniquement les connexions déjà établies.
- name: Allow FORWARD for established connections inbound
  ansible.builtin.iptables:
    chain: FORWARD
    destination: 10.0.0.0/16
    ctstate: [ESTABLISHED, RELATED]
    jump: ACCEPT

# persistant au reboot
- name: Install iptables-persistent
  ansible.builtin.apt:
    name: iptables-persistent
    state: present

- name: Save iptables rules
  ansible.builtin.command: netfilter-persistent save
  changed_when: true

# ==========================================
# REPERTOIRES
# ==========================================

- name: Ensure config directory exists
  ansible.builtin.file:
    path: "{{ angie_lb_conf_dir }}"
    state: directory
    mode: "0755"
    owner: "65532"
    group: "65532"

- name: Ensure ACME certs directory exists
  ansible.builtin.file:
    path: "{{ angie_lb_conf_dir }}/acme"
    state: directory
    mode: "0755"
    owner: "65532"
    group: "65532"

- name: Ensure ACME client directory exists
  ansible.builtin.file:
    path: "{{ angie_lb_conf_dir }}/acme_client"
    state: directory
    mode: "0755"
    owner: "65532"
    group: "65532"

- name: Ensure Angie tmp directory exists
  ansible.builtin.file:
    path: "{{ angie_lb_conf_dir }}/tmp"
    state: directory
    mode: "0755"
    owner: "65532"
    group: "65532"

- name: Ensure step-ca home directory exists
  ansible.builtin.file:
    path: "{{ step_ca_home }}"
    state: directory
    mode: "0755"
    owner: "65532"
    group: "65532"

- name: Ensure secrets directory exists
  ansible.builtin.file:
    path: "{{ angie_lb_conf_dir }}/secrets"
    state: directory
    mode: "0700"
    owner: "65532"
    group: "65532"

# ==========================================
# SECRETS
# ==========================================

- name: Deploy step-ca password
  ansible.builtin.copy:
    content: "{{ step_ca_password }}"
    dest: "{{ angie_lb_conf_dir }}/secrets/step_password"
    mode: "0400"
    owner: "65532"
    group: "65532"
  no_log: true

# ==========================================
# CONFIGURATION
# ==========================================

- name: Deploy Angie LB configuration
  ansible.builtin.template:
    src: angie-lb.conf.j2
    dest: "{{ angie_lb_conf_path }}"
    mode: "0644"
    owner: "65532"
    group: "65532"
  notify: Reload angie lb

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ angie_lb_conf_dir }}/docker-compose.yml"
    mode: "0644"
    owner: "65532"
    group: "65532"

# ==========================================
# IMAGES
# ==========================================

- name: Pull Angie image
  community.docker.docker_image:
    name: "{{ angie_lb_image }}"
    source: pull
    force_source: true

- name: Pull step-ca image
  community.docker.docker_image:
    name: "{{ step_ca_image }}"
    source: pull
    force_source: true

# ==========================================
# BOOTSTRAP STEP-CA (one-shot)
# ==========================================

- name: Check if step-ca is already initialized
  ansible.builtin.stat:
    path: "{{ step_ca_cert_dir }}/root_ca.crt"
  register: __step_ca_initialized

- name: Bootstrap step-ca
  community.docker.docker_container:
    name: step-ca-init
    image: "{{ step_ca_image }}"
    state: started
    detach: false
    cleanup: true
    volumes:
      - "{{ step_ca_home }}:/home/step"
      - "{{ angie_lb_conf_dir }}/secrets/step_password:/run/secrets/step_password:ro"
    env:
      STEPPATH: /home/step
    entrypoint:
      - step
      - ca
      - init
      - "--name={{ step_ca_name }}"
      - "--dns=localhost"
      - "--dns={{ step_ca_container_name }}"
      - "--address=0.0.0.0:9000"
      - "--provisioner={{ step_ca_provisioner }}"
      - "--provisioner-password-file=/run/secrets/step_password"
      - "--password-file=/run/secrets/step_password"
      - "--acme"
  when: not __step_ca_initialized.stat.exists

# ==========================================
# COMPOSE UP
# ==========================================

- name: Launch docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ angie_lb_conf_dir }}"
    state: present
