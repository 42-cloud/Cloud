---
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: angie-lb-ubuntu-test
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: /lib/systemd/systemd
    privileged: true
    pre_build_image: true
    user: root
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /lib/modules:/lib/modules:ro
      - /tmp/molecule_shared:/tmp/molecule_shared
    tmpfs: [/tmp, /run, /run/lock]
provisioner:
  name: ansible
  config_options:
    defaults:
      host_key_checking: false
      remote_tmp: /tmp/.ansible/tmp
      roles_path: ../../../
      stdout_callback: default
      callbacks_enabled: ansible.builtin.default
    ssh_connection:
      pipelining: false
  ansible_args: 
    - --diff
    - -v
  env:
    ANSIBLE_ROLES_PATH: ../../../
    ANSIBLE_STDOUT_CALLBACK: default
    ANSIBLE_CALLBACK_RESULT_FORMAT: yaml
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  name: default
  test_sequence:
    - dependency
    - syntax
    - destroy
    - create
    - prepare
    - converge
    - verify
    - destroy
