---
- name: Prepare angie-lb instance
  hosts: all
  become: true
  tasks:
    - name: Ensure python3 is present
      ansible.builtin.apt:
        name: python3
        state: present
        update_cache: true
    - name: Ensure iptables is present
      ansible.builtin.apt:
        name: [iptables, ufw, kmod]
        state: present
    - name: Ensure ip_tables kernel module is loaded
      community.general.modprobe:
        name: ip_tables
        state: present
    - name: Enable UFW (non-interactive)
      ansible.builtin.command: ufw --force enable
      changed_when: true
      when: lookup('env', 'GITHUB_ACTIONS') != 'true'
    - name: Install required Ansible collections deps (python-docker)
      ansible.builtin.apt:
        name: [python3-docker]
        state: present
    - name: Ensure shared directory exists on localhost
      ansible.builtin.file:
        path: /tmp/molecule_shared/wordpress_stack/angie/certs
        state: directory
        mode: '0755'
      delegate_to: localhost
      become: false
