---
# wordpress - molecule/tasks/main.yml

- name: Ensure Python cryptography library is installed for SSL modules
  ansible.builtin.apt:
    name: python3-cryptography
    state: present
    update_cache: true
  become: true

# --- CERT KEYS ---

- name: Handle TLS certificates
  delegate_to: "{{ wordpress_delegate_host | default(inventory_hostname) }}"
  become: "{{ wordpress_become_compose | default(true) }}"
  block:
    - name: Ensure cert directory exists
      ansible.builtin.file:
        path: "{{ wordpress_cert_dir }}"
        state: directory
        mode: "0755"

    - name: Generate key
      community.crypto.openssl_privatekey:
        path: "{{ wordpress_cert_key_path }}"
        size: 2048
        type: RSA
        mode: "0600"

    - name: Generate CSR
      community.crypto.openssl_csr:
        path: "{{ wordpress_cert_csr_path }}"
        privatekey_path: "{{ wordpress_cert_key_path }}"
        common_name: "{{ wordpress_cert_domain }}"

    - name: Generate Certificate
      community.crypto.x509_certificate:
        path: "{{ wordpress_cert_crt_path }}"
        privatekey_path: "{{ wordpress_cert_key_path }}"
        csr_path: "{{ wordpress_cert_csr_path }}"
        provider: selfsigned
        selfsigned_not_after: "+365d"
        mode: "0644"

# --- CONFIG AND COMPOSE UP ---

- name: Ensure target root directory exists
  ansible.builtin.file:
    path: "{{ wordpress_compose_src }}"
    state: directory
    mode: "0755"
  delegate_to: "{{ wordpress_delegate_host | default(inventory_hostname) }}"
  become: "{{ wordpress_become_compose | default(true) }}"

- name: Deploy .env file
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ wordpress_compose_src }}/.env"
    mode: "0600"
  delegate_to: "{{ wordpress_delegate_host | default(inventory_hostname) }}"
  become: "{{ wordpress_become_compose | default(true) }}"

- name: Ensure configuration subdirectories exist
  ansible.builtin.file:
    path: "{{ wordpress_compose_src }}/{{ item }}"
    state: directory
    mode: "0775"
  loop:
    - mariadb
    - angie
    - wordpress
  delegate_to: "{{ wordpress_delegate_host | default(inventory_hostname) }}"
  become: "{{ wordpress_become_compose | default(true) }}"

- name: Populate db conf
  ansible.builtin.template:
    src: mariadb.conf.j2
    dest: "{{ wordpress_db_conf_path_host }}"
    mode: "0644"
  delegate_to: "{{ wordpress_delegate_host | default(inventory_hostname) }}"
  become: "{{ wordpress_become_compose | default(true) }}"

- name: Populate init sql
  ansible.builtin.template:
    src: init.sql.j2
    dest: "{{ wordpress_compose_src }}/mariadb/init.sql"
    mode: "0644"
  delegate_to: "{{ wordpress_delegate_host | default(inventory_hostname) }}"
  become: "{{ wordpress_become_compose | default(true) }}"

- name: Deploy Angie configuration file
  ansible.builtin.template:
    src: angie.conf.j2
    dest: "{{ wordpress_compose_src }}/angie/angie.conf"
    mode: "0644"
  notify: Reload angie
  delegate_to: "{{ wordpress_delegate_host | default(inventory_hostname) }}"
  become: "{{ wordpress_become_compose | default(true) }}"

- name: Copy wordpress Dockerfile
  ansible.builtin.copy:
    src: wordpress/Dockerfile
    dest: "{{ wordpress_compose_src }}/wordpress/Dockerfile"
    mode: "0644"
  delegate_to: "{{ wordpress_delegate_host | default(inventory_hostname) }}"
  become: "{{ wordpress_become_compose | default(true) }}"

- name: Populate docker compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ wordpress_compose_src }}/docker-compose.yml"
    mode: "0640"
  delegate_to: "{{ wordpress_delegate_host | default(inventory_hostname) }}"
  become: "{{ wordpress_become_compose | default(true) }}"

# delegated to localhost in test
- name: Launch docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ wordpress_compose_src }}"
    state: present
  delegate_to: "{{ wordpress_delegate_host | default(inventory_hostname) }}"
  become: "{{ wordpress_become_compose | default(true) }}"

# --- WORDPRESS install and customization ---

- name: Check if wp-cli is installed
  ansible.builtin.shell: |
    docker exec {{ wordpress_wp_container_name }} which wp
  register: __wordpress_cli_check
  changed_when: false
  delegate_to: "{{ wordpress_delegate_host | default(inventory_hostname) }}"

- name: Check if wp core is installed
  ansible.builtin.shell: |
    {{ wordpress_wp_cli_exec }} wp core is-installed
  register: __wordpress_wp_core_is_configured
  failed_when: false
  changed_when: false
  delegate_to: "{{ wordpress_delegate_host | default(inventory_hostname) }}"

- name: Run Wordpress automated configuration
  when: __wordpress_wp_core_is_configured.rc != 0
  delegate_to: "{{ wordpress_delegate_host | default(inventory_hostname) }}"
  block:
    - name: Execute wp-core install
      ansible.builtin.shell: |
        {{ wordpress_wp_cli_exec }} wp core install \
        --url="https://{{ wordpress_duckdns_domain }}.duckdns.org" \
        --title="{{ wordpress_wp_site_title }}" \
        --admin_user="{{ wordpress_wp_admin_user }}" \
        --admin_password="{{ wordpress_wp_admin_default_password }}" \
        --admin_email="{{ wordpress_wp_admin_email }}"
      changed_when: true

    - name: Disable file editing from Wordpress admin dashboard
      ansible.builtin.shell: |
        {{ wordpress_wp_cli_exec }} wp config set DISALLOW_FILE_EDIT true --raw
      changed_when: true

    - name: Install and activate theme
      ansible.builtin.shell: |
        {{ wordpress_wp_cli_exec }} wp theme install extendable --activate
      changed_when: true

    - name: Purge all posts and pages
      ansible.builtin.shell: |
        {{ wordpress_wp_cli_exec }} wp post delete \
          $({{ wordpress_wp_cli_exec }} wp post list \
          --post_type=post --format=ids) --force
        {{ wordpress_wp_cli_exec }} wp post delete \
          $({{ wordpress_wp_cli_exec }} wp post list \
          --post_type=page --format=ids) --force
      failed_when: false
      changed_when: false

    - name: Create static pages
      ansible.builtin.shell: |
        {{ wordpress_wp_cli_exec }} wp post create \
          --post_type=page \
          --post_title="The project" \
          --post_content="Welcome to our Cloud-1 project page. A project about hardening and automation" \
          --post_status=publish
      changed_when: true

    - name: Download logos directly inside the container volume
      ansible.builtin.shell: |
        {{ wordpress_wp_cli_exec }} curl -sSL \
          "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/{{ item.url_name }}.png" \
          -o "/var/www/html/{{ item.file_name }}-logo.png"
      loop:
        - { url_name: "terraform", file_name: "terraform" }
        - { url_name: "ansible", file_name: "ansible" }
      changed_when: true
      tags: ["download_logos"]

    - name: Create Ansible post
      ansible.builtin.shell: |
        {{ wordpress_wp_cli_exec }} wp post create \
              --post_type=post \
              --post_title="Ansible" \
              --post_status=publish \
              --porcelain \
              --post_content="{{ lookup('ansible.builtin.file', 'files/wordpress/posts/ansible.html') }}"
      register: __wordpress_ansible_post_id
      changed_when: true

    - name: Create Terraform post
      ansible.builtin.shell: |
        {{ wordpress_wp_cli_exec }} wp post create \
              --post_type=post \
              --post_title="Terraform" \
              --post_status=publish \
              --porcelain \
              --post_content="{{ lookup('ansible.builtin.file', 'files/wordpress/posts/terraform.html') }}"
      register: __wordpress_terraform_post_id
      changed_when: true

    - name: Create Yaml post
      ansible.builtin.shell: |
        {{ wordpress_wp_cli_exec }} wp post create \
              --post_type=post \
              --post_title="Yaml" \
              --post_status=publish \
              --porcelain \
              --post_content="{{ lookup('ansible.builtin.file', 'files/wordpress/posts/yaml.html') }}"
      register: __wordpress_yaml_post_id
      changed_when: true

    - name: Verify logo files exist in container
      ansible.builtin.shell: |
        {{ wordpress_wp_cli_exec }} ls -la /var/www/html/terraform-logo.png /var/www/html/ansible-logo.png
      register: __wordpress_logo_check
      changed_when: false
      when: ansible_verbosity >= 1

    - name: Debug logo presence
      ansible.builtin.debug:
        var: __wordpress_logo_check.stdout
      when: ansible_verbosity >= 1

    - name: Debug post IDs
      ansible.builtin.debug:
        msg:
          - "terraform id: '{{ __wordpress_terraform_post_id.stdout }}'"
          - "ansible id: '{{ __wordpress_Ansible_post_id.stdout }}'"
      when: ansible_verbosity >= 1

    - name: Debug final post_id values at import time
      ansible.builtin.debug:
        msg: "post_id='{{ item.post_id | trim }}' file='{{ item.file_name }}'"
      loop:
        - { file_name: "terraform", post_id: "{{ __wordpress_terraform_post_id.stdout }}" }
        - { file_name: "ansible", post_id: "{{ __wordpress_ansible_post_id.stdout }}" }
      when: ansible_verbosity >= 1

    - name: Configure WordPress media sizes
      ansible.builtin.shell: |
        {{ wordpress_wp_cli_exec }} wp option update large_size_w 800
        {{ wordpress_wp_cli_exec }} wp option update large_size_h 600
        {{ wordpress_wp_cli_exec }} wp option update medium_size_w 400
        {{ wordpress_wp_cli_exec }} wp option update medium_size_h 300
      changed_when: true

    - name: Import image and set it as Featured Image
      ansible.builtin.shell: |
        {{ wordpress_wp_cli_exec }} wp media import /var/www/html/{{ item.file_name }}-logo.png \
          --post_id={{ item.post_id | trim }} \
          --title="{{ item.display_name }} Logo" \
          --featured_image
      loop:
        - name: "HashiCorp-Terraform"
          file_name: "terraform"
          display_name: "Terraform"
          post_id: "{{ __wordpress_terraform_post_id.stdout }}"
        - name: "Ansible"
          file_name: "ansible"
          display_name: "Ansible"
          post_id: "{{ __wordpress_ansible_post_id.stdout }}"
      changed_when: true

    - name: Regenerate thumbnails
      ansible.builtin.shell: |
        {{ wordpress_wp_cli_exec }} wp media regenerate --yes
      changed_when: false
