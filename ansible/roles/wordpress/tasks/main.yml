---
# noqa yaml[line-length]
# ==============================================================================
# ROOT CERTIFICATE DIFFUSION
# ==============================================================================

# wordpress - molecule/tasks/main.yml
- name: Ensure Python cryptography library is installed for SSL modules
  ansible.builtin.apt:
    name: python3-cryptography
    state: present
    update_cache: true
  become: true

- name: Create a dummy domain certificate for Angie TLS
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -newkey rsa:2048 -nodes
      -keyout /tmp/molecule_shared/wordpress_stack/angie/certs/nuage-un.duckdns.org.key
      -out /tmp/molecule_shared/wordpress_stack/angie/certs/nuage-un.duckdns.org.crt
      -days 1 -subj "/CN=nuage-un.duckdns.org"
  changed_when: false
  when: molecule_dns_skip | default(false) | bool

# {{ wordpress_compose_src }}/angie/certs
- name: Ensure Angie tmp directory exists
  ansible.builtin.file:
    path: "{{ wordpress_cert_host_dir }}"
    state: directory
    mode: '0755'

- name: Ensure Angie acme directories exist
  ansible.builtin.file:
    path: '{{ wordpress_compose_src }}/angie/{{ item }}'
    state: directory
    mode: '0755'
    owner: '65532'
    group: '65532'
  loop: [acme, acme_client]

- name: Fetch step-ca root certificate from LB
  ansible.builtin.fetch:
    src: '{{ global_angie_lb_conf_dir }}/step/certs/root_ca.crt'
    dest: "/tmp/step_ca_root.crt"
    flat: true
  delegate_to: "{{ groups['angie_lb'][0] }}"

- name: Validate copied CA certificate
  delegate_to: localhost
  ansible.builtin.command:
    cmd: "openssl x509 -in /tmp/step_ca_root.crt -noout -subject -issuer"
  changed_when: false
  become: false

# ==============================================================================
# HOST DIRECTORY STRUCTURE
# ==============================================================================

- name: Ensure project root directory exists (Host Admins)
  ansible.builtin.file:
    path: "{{ wordpress_compose_src }}"
    state: directory
    owner: "{{ 'root' if (wordpress_become_compose | default(true) | bool) else omit }}"
    group: "{{ 'admins' if (wordpress_become_compose | default(true) | bool) else omit }}"
    mode: "{{ '0775' if (wordpress_become_compose | default(true) | bool) else omit }}"
  delegate_to: "{{ wordpress_delegate_host | default(inventory_hostname) }}"
  become: "{{ wordpress_become_compose | default(true) }}"

- name: Ensure structural configuration subdirectories exist and are owned by host admins
  ansible.builtin.file:
    path: "{{ wordpress_compose_src }}/{{ item }}"
    state: directory
    owner: "{{ 'root' if (wordpress_become_compose | default(true) | bool) else omit }}"
    group: "{{ 'admins' if (wordpress_become_compose | default(true) | bool) else omit }}"
    mode: "{{ '0775' if (wordpress_become_compose | default(true) | bool) else '0777' }}"
  loop: [mariadb, angie, phpmyadmin]
  delegate_to: "{{ wordpress_delegate_host | default(inventory_hostname) }}"
  become: "{{ wordpress_become_compose | default(true) }}"

- name: Ensure runtime and data subdirectories exist and are owned by non root user
  ansible.builtin.file:
    path: "{{ wordpress_compose_src }}/{{ item }}"
    state: directory
    owner: "{{ wordpress_apko_uid | default('65532') if (wordpress_become_compose | default(true) | bool) else omit }}"
    group: "{{ wordpress_apko_gid | default('65532') if (wordpress_become_compose | default(true) | bool) else omit }}"
    mode: "{{ '0755' if (wordpress_become_compose | default(true) | bool) else '0777' }}"
  loop: [angie/tmp, wordpress]
  delegate_to: "{{ wordpress_delegate_host | default(inventory_hostname) }}"
  become: "{{ wordpress_become_compose | default(true) }}"

# ==============================================================================
# DEPLOY SERVICES COMPONENTS TO HOST
# ==============================================================================
- name: Mariadb pre-launch host configuration
  delegate_to: '{{ wordpress_delegate_host | default(inventory_hostname) }}'
  become: '{{ wordpress_become_compose | default(true) }}'
  tags: [wp_host_db]
  block:
    - name: Populate db conf
      ansible.builtin.template:
        src: mariadb.conf.j2
        dest: '{{ wordpress_compose_src }}/mariadb/mariadb.conf'
        mode: '0644'
    - name: Populate init sql
      ansible.builtin.template:
        src: init.sql.j2
        dest: '{{ wordpress_compose_src }}/mariadb/init.sql'
        mode: '0644'
  rescue:
    - name: Fail explicitly if db host configuration fails
      ansible.builtin.fail:
        msg: host configuration for db service failed
- name: Wordpress pre-launch host configuration
  delegate_to: '{{ wordpress_delegate_host | default(inventory_hostname) }}'
  become: '{{ wordpress_become_compose | default(true) }}'
  tags: [wp_host_wp]
  block:
    - name: Copy WordPress Docker build context
      ansible.builtin.copy:
        src: wordpress/
        dest: '{{ wordpress_compose_src }}/wordpress/'
        mode: '0755'
    - name: Copy static images assets
      ansible.builtin.copy:
        src: wordpress/images/
        dest: '{{ wordpress_compose_src }}/wordpress/assets/'
        mode: '0755'
    - name: Get assets
      ansible.builtin.shell: |
        ls '{{ wordpress_compose_src }}/wordpress/assets/'
      register: wordpress_assets
      changed_when: false
    - name: Check assets
      ansible.builtin.debug:
        msg: '{{ wordpress_assets }}'
    - name: Deploy wp-config.php
      ansible.builtin.template:
        src: wordpress/wp-config-docker.php.j2
        dest: '{{ wordpress_compose_src }}/wordpress/wp-config.php'
        mode: '0644'
    - name: Ensure mu-plugins directory exists
      ansible.builtin.file:
        path: '{{ wordpress_compose_src }}/wordpress/wp-content/mu-plugins'
        state: directory
        mode: '0755'
    - name: Deploy must use plugin for dynamic title
      ansible.builtin.template:
        src: wordpress/mu-plugins/instance-title.php.j2
        dest: '{{ wordpress_compose_src }}/wordpress/wp-content/mu-plugins/instance-title.php'
        mode: '0644'
    - name: Deploy must use plugin for devsecops styles
      ansible.builtin.template:
        src: wordpress/mu-plugins/devsecops-style.php.j2
        dest: '{{ wordpress_compose_src }}/wordpress/wp-content/mu-plugins/devsecops-style.php'
        mode: '0644'
    - name: Deploy devsecops card styles
      ansible.builtin.copy:
        src: wordpress/devsecops-cards.css
        dest: '{{ wordpress_compose_src }}/wordpress/wp-content/mu-plugins/devsecops-cards.css'
        mode: '0644'
  rescue:
    - name: Fail explicitly if worpress host configuration fails
      ansible.builtin.fail:
        msg: host configuration for wordpress service failed
- name: Angie pre-launch host configuration
  delegate_to: '{{ wordpress_delegate_host | default(inventory_hostname) }}'
  become: '{{ wordpress_become_compose | default(true) }}'
  tags: [wp_host_angie]
  block:
    - name: Debug step-ca availability
      ansible.builtin.debug:
        msg: >-
          {{
            'LB Host: ' + groups['angie_lb'][0]
            if 'angie_lb' in groups and groups['angie_lb'] | length > 0
            else 'No LB group found (Molecule context)'
          }}
    - name: Deploy Angie configuration file
      ansible.builtin.template:
        src: angie.conf.j2
        dest: '{{ wordpress_compose_src }}/angie/angie.conf'
        mode: '0644'
      notify: Reload angie
    - name: Copy step-ca root certificate to instance host directory
      ansible.builtin.copy:
        src: /tmp/step_ca_root.crt
        dest: "{{ wordpress_compose_src }}/angie/certs/step_ca_root.crt"
        mode: '0644'
        owner: "{{ wordpress_apko_uid | default('65532') }}"
        group: "{{ wordpress_apko_gid | default('65532') }}"
  rescue:
    - name: Fail explicitly if angie host configuration fails
      ansible.builtin.fail:
        msg: host configuration for angie service failed
- name: Deploy phpmyadmin config
  ansible.builtin.template:
    src: config.inc.php.j2
    dest: '{{ wordpress_compose_src }}/phpmyadmin/config.inc.php'
    mode: '0644'
    owner: "{{ (wordpress_become_compose | default(true) | bool) | ternary('65532', omit) }}"
    group: "{{ (wordpress_become_compose | default(true) | bool) | ternary('65532', omit) }}"
  become: true

# ==============================================================================
# SECRETS AND DOCKER
# ==============================================================================

- name: DEBUG stat phpmyadmin config before compose
  ansible.builtin.stat:
    path: '{{ wordpress_compose_src }}/phpmyadmin/config.inc.php'
  register: __wordpress_pma_stat
  delegate_to: '{{ wordpress_delegate_host | default(inventory_hostname) }}'

- name: DEBUG show phpmyadmin config stat
  ansible.builtin.debug:
    msg:
      exists: "{{ __wordpress_pma_stat.stat.exists }}"
      isdir: "{{ __wordpress_pma_stat.stat.isdir | default('N/A') }}"
      isreg: "{{ __wordpress_pma_stat.stat.isreg | default('N/A') }}"
      owner: "{{ __wordpress_pma_stat.stat.pw_name | default('N/A') }}"
      mode: "{{ __wordpress_pma_stat.stat.mode | default('N/A') }}"
      size: "{{ __wordpress_pma_stat.stat.size | default('N/A') }}"
- name: Secrets and compose up
  delegate_to: '{{ wordpress_delegate_host | default(inventory_hostname) }}'
  become: '{{ wordpress_become_compose | default(true) }}'
  tags: [wp_host_compose]
  block:
    - name: Populate docker compose
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: '{{ wordpress_compose_src }}/docker-compose.yml'
        mode: '0640'
    - name: Ensure secrets directory exists
      ansible.builtin.file:
        path: '{{ wordpress_compose_src }}/secrets'
        state: directory
        mode: '0700'
    - name: Deploy db passwords and secrets
      ansible.builtin.copy:
        content: '{{ item.value | trim }}'
        dest: '{{ wordpress_compose_src }}/secrets/{{ item.filename }}'
        owner: "{{ (wordpress_become_compose | default(true) | bool) | ternary('65532', omit) }}"
        group: "{{ (wordpress_become_compose | default(true) | bool) | ternary('65532', omit) }}"
        mode: "{{ (wordpress_become_compose | default(true) | bool) | ternary('0444', '0644') }}"
      loop:
        - filename: db_password
          value: '{{ wordpress_db_password }}'
        - filename: db_root_password
          value: '{{ wordpress_db_root_password }}'
        - filename: wp_admin_password
          value: '{{ wordpress_wp_admin_default_password }}'
      no_log: true

    # delegated to localhost in test
    - name: Launch docker compose
      community.docker.docker_compose_v2:
        project_src: '{{ wordpress_compose_src }}'
        state: present
    - name: Wait for wordpress container to be healthy
      ansible.builtin.shell: |
        docker inspect --format='{{ "{{.State.Health.Status}}" }}' {{ wordpress_wp_container_name }}
      register: __wordpress_health
      until: __wordpress_health.stdout == "healthy"
      retries: 5
      delay: 10
      changed_when: false
  rescue:
    - name: Fail explicitly if secrets or compose fails
      ansible.builtin.fail:
        msg: compose failed

# ==============================================================================
# WORDPRESS PROVISIONNING
# ==============================================================================
- name: WordPress - Post-launch configuration and content seeding
  delegate_to: '{{ wordpress_delegate_host | default(inventory_hostname) }}'
  become: '{{ wordpress_become_compose | default(true) }}'
  tags: [wp_setup]
  block:
    - name: Seed WP themes/plugins into persistent volume if missing
      ansible.builtin.shell: |
        set -e
        docker exec wordpress sh -lc '
          if [ ! -f /var/www/html/wp-content/themes/twentytwentyfive/style.css ]; then
            echo "Seeding themes/plugins into /var/www/html/wp-content ..."
            mkdir -p /var/www/html/wp-content/themes /var/www/html/wp-content/plugins
            cp -a /usr/src/wordpress/wp-content/themes/. /var/www/html/wp-content/themes/
            cp -a /usr/src/wordpress/wp-content/plugins/. /var/www/html/wp-content/plugins/
          fi
        '
      changed_when: false
    - name: Fix wp-content permissions
      ansible.builtin.shell: |
        set -o pipefail
        MIGR_FILES=$(docker exec --user 0 {{ wordpress_wp_container_name }} sh -c \
          'find /var/www/html/wp-content -not -path "*/mu-plugins*" \( ! -user 65532 -o ! -group 65532 \) -print')
        if [ -n "$MIGR_FILES" ]; then
          echo "$MIGR_FILES" | docker exec -i --user 0 {{ wordpress_wp_container_name }} xargs -r chown 65532:65532
          echo "CHANGED"
        fi
      register: __wordpress_perms_res
      changed_when: "'CHANGED' in __wordpress_perms_res.stdout"
      failed_when: false
    - name: Get wp core installation state
      ansible.builtin.shell: |
        {{ wordpress_wp_cli_exec }} core is-installed
      register: __wordpress_post_install_check
      failed_when: false
      changed_when: false
    - name: DEBUG Display wp core installation state
      ansible.builtin.debug:
        msg: rc={{ __wordpress_post_install_check.rc }} stderr={{ __wordpress_post_install_check.stderr }}
    - name: Check if WordPress core files exist
      ansible.builtin.shell: |
        docker exec {{ wordpress_wp_container_name }} \
          test -f {{ wordpress_wp_dir_path_dest }}/wp-includes/version.php
      register: __wordpress_core_files_present
      failed_when: false
      changed_when: false
    - name: Download WordPress core if missing
      ansible.builtin.shell: |
        {{ wordpress_wp_cli_exec }} core download \
          --locale=fr_FR \
          --skip-content
      when: __wordpress_core_files_present.rc != 0
      changed_when: true
    - name: Initial configuration tasks
      when: (__wordpress_post_install_check.rc | default(1)) != 0
      block:
        - name: Execute wp-core install
          ansible.builtin.shell: |
            docker exec --user 65532 {{ wordpress_wp_container_name }} sh -c '
              wp --path={{ wordpress_wp_dir_path_dest }} core install \
                --url="{{ wordpress_wp_url }}" \
                --title="{{ wordpress_wp_site_title }}" \
                --admin_user="{{ wordpress_wp_admin_user }}" \
                --admin_password="$(cat /run/secrets/wp_admin_password)" \
                --admin_email="{{ wordpress_wp_admin_email }}" \
                --skip-email
            '
          changed_when: true
          no_log: true
        - name: Install and activate theme
          ansible.builtin.shell: |
            {{ wordpress_wp_cli_exec }} theme install {{ wordpress_wp_theme }} --activate
          changed_when: true
      rescue:
        - name: Fail explicitly if initial configuration fails
          ansible.builtin.fail:
            msg: wordpress initial configuration failed
    - name: Dynamic content provisioning tasks
      when: (__wordpress_post_install_check.rc | default(1)) != 0 or (wordpress_force_setup
        | default(false) | bool)
      tags: [wp_content]
      block:
        - name: Idempotent - Force sync siteurl and home variables
          ansible.builtin.shell: |
            docker exec --user {{ global_apko_uid | default('65532') }} \
              wordpress wp --path={{ global_wp_dir | default('/var/www/html') }} \
              option update siteurl "{{ wordpress_wp_url }}"
            docker exec --user {{ global_apko_uid | default('65532') }} \
              wordpress wp --path={{ global_wp_dir | default('/var/www/html') }} \
              option update home "{{ wordpress_wp_url }}"
          changed_when: true
          tags: [wp_url]
        - name: Purge default posts and pages
          ansible.builtin.shell: |
            {{ wordpress_wp_cli_exec }} post delete \
              $({{ wordpress_wp_cli_exec }} post list --post_type=post --format=ids) --force
            {{ wordpress_wp_cli_exec }} post delete \
              $({{ wordpress_wp_cli_exec }} post list --post_type=page --format=ids) --force
          failed_when: false
          changed_when: true
        - name: Clean up default navigation menus and unwanted elements
          ansible.builtin.shell: |
            {{ wordpress_wp_cli_exec }} menu delete \
              $({{ wordpress_wp_cli_exec }} menu list --format=ids) 2>/dev/null || true
            {{ wordpress_wp_cli_exec }} widget reset --all
          failed_when: false
          changed_when: true
        - name: DEBUG Check assets are visible inside container
          ansible.builtin.shell: |
            docker exec {{ wordpress_wp_container_name }} sh -lc \
              'ls -la /tmp/wp-assets && test -f /tmp/wp-assets/{{ item.filename }}'
          loop:
            - {filename: dan-lorenc.png}
            - {filename: solomon-hykes.png}
            - {filename: mitchell-hashimoto.jpeg}
            - {filename: stephane-robert.png}
          changed_when: false
          become: '{{ wordpress_become_compose | default(true) }}'
        - name: Create static page
          ansible.builtin.shell: |
            {{ wordpress_wp_cli_exec }} post create \
              --post_type=page \
              --post_title="The project" \
              --post_content="Welcome to our Cloud-1 project page. A project about hardening and automation" \
              --post_status=publish
          changed_when: true
        - name: Create 'heroes' category if missing
          ansible.builtin.shell: |
            if ! {{ wordpress_wp_cli_exec }} term get category heroes --by=slug >/dev/null 2>&1; then
              {{ wordpress_wp_cli_exec }} term create category "heroes" --slug="heroes"
            fi
          changed_when: true

      # uses cat > /tmp -> post create -> rm
        - name: Create WordPress posts from local HTML files safely
          ansible.builtin.shell: |
            docker exec -i {{ wordpress_wp_container_name }} sh -c 'cat > /tmp/{{ item.id }}.html' << 'EOF'
            {{ lookup('ansible.builtin.file', 'files/wordpress/posts/' ~ item.id ~ '.html') | trim }}
            EOF
            {{ wordpress_wp_cli_exec }} post create "/tmp/{{ item.id }}.html" \
              --post_type=post \
              --post_title="{{ item.title }}" \
              --post_status=publish \
              --post_category="heroes" \
              --porcelain
            docker exec {{ wordpress_wp_container_name }} rm -f /tmp/{{ item.id }}.html
          loop:
            - {title: Solomon Hykes, id: solomon-hykes}
            - {title: Mitchell Hashimoto, id: mitchell-hashimoto}
            - {title: Dan Lorenc, id: dan-lorenc}
            - {title: Stéphane Robert, id: stephane-robert}
          register: __wordpress_posts_bulk
          changed_when: true
        - name: Configure WordPress media sizes
          ansible.builtin.shell: |
            {{ wordpress_wp_cli_exec }} option update large_size_w 600
            {{ wordpress_wp_cli_exec }} option update large_size_h 400
          changed_when: true
        - name: Import images from container root and set as Featured Image
          ansible.builtin.shell: |
            {{ wordpress_wp_cli_exec }} media import "/tmp/wp-assets/{{ item.filename }}" \
              --post_id={{ (wordpress_posts[item.name] | trim) }} \
              --title="{{ item.display_name }} Logo" \
              --featured_image
          vars:
            wordpress_posts: "{{ dict(__wordpress_posts_bulk.results | map(attribute='item.id')\
              \ | zip(__wordpress_posts_bulk.results | map(attribute='stdout')))\
              \ }}"
          loop:
            - {name: solomon-hykes, filename: solomon-hykes.png, display_name: Solomon
                Hykes}
            - {name: mitchell-hashimoto, filename: mitchell-hashimoto.jpeg, display_name: Mitchell
                Hashimoto}
            - {name: dan-lorenc, filename: dan-lorenc.png, display_name: Dan Lorenc}
            - {name: stephane-robert, filename: stephane-robert.png, display_name: Stephane
                Robert}
          changed_when: true
      rescue:
        - name: Fail explicitly if content provisioning fails
          ansible.builtin.fail:
            msg: wordpress content provisioning failed

    - name: Configure WordPress Permalinks structure to postname
      ansible.builtin.shell: |
        set -o pipefail
        # Extraction propre de la valeur actuelle via la BDD
        CURRENT_STRUC=$({{ wordpress_wp_cli_exec }} option get permalink_structure 2>/dev/null | tr -d '\r\n ')

        TARGET_STRUC="/%category%/%postname%/"
        CLEAN_TARGET="/%category%/%postname%/"

        if [ "$CURRENT_STRUC" != "/%category%/%postname%/" ]; then
          {{ wordpress_wp_cli_exec }} option update permalink_structure '/%category%/%postname%/' >/dev/null
          {{ wordpress_wp_cli_exec }} rewrite flush >/dev/null
          echo "PERMALINKS_CHANGED"
        fi
      register: __wordpress_permalink_res
      changed_when: "'PERMALINKS_CHANGED' in __wordpress_permalink_res.stdout"
      failed_when: false
  rescue:
    - name: Fail explicitly if wordpress initialization fails
      ansible.builtin.fail:
        msg: Wordpress instance initialization failed
