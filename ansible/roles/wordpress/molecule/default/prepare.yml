---
# wordpress - molecule/default/prepare.yml
- name: Prepare instance with bootstrap requirements
  hosts: all
  become: true
  vars:
    bootstrap_project_path: /tmp/molecule_shared/wordpress_stack
    bootstrap_become: false
  pre_tasks:
    - name: Hard purge of the entire shared stack directory via host Docker
      ansible.builtin.command: >
        docker run --rm
        -v /tmp/molecule_shared:/data
        alpine sh -c "rm -rf /data/wordpress_stack"
      delegate_to: localhost
      become: false
      changed_when: true
  tasks:
    - name: Install Docker CLI, Compose and OpenSSL tools
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
          - openssl
        state: present
        update_cache: true

    - name: DEBUG bootstrap_project_path at prepare time
      ansible.builtin.debug:
        msg: "bootstrap_project_path={{ bootstrap_project_path }}"

    - name: Execute bootstrap role to create groups and directories
      ansible.builtin.include_role:
        name: bootstrap

    - name: Ensure shared certs directory exists with open permissions for Angie/Step
      ansible.builtin.file:
        path: /tmp/molecule_shared/wordpress_stack/angie/certs
        state: directory
        mode: '0777'
      delegate_to: localhost
      become: false

    - name: Generate a self-signed test CA certificate
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -newkey rsa:2048
          -keyout /tmp/step_ca_root.key
          -out /tmp/step_ca_root.crt
          -days 365 -nodes
          -subj "/CN=test-step-ca"
      changed_when: true

    - name: Validate generated test CA certificate
      ansible.builtin.command:
        cmd: openssl x509 -in /tmp/step_ca_root.crt -noout -subject -issuer
      changed_when: false
