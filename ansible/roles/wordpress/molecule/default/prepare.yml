---
# wordpress - molecule/default/prepare.yml
- name: Prepare instance with bootstrap requirements
  hosts: all
  become: true
  vars:
    bootstrap_project_path: /tmp/molecule_shared/wordpress_stack
    bootstrap_become: false
  tasks:
    - name: Remove existing molecule_shared directory if present
      ansible.builtin.file:
        path: /tmp/molecule_shared
        state: absent
      delegate_to: localhost
      become: false
    - name: Create symlink molecule_shared -> user-scoped path
      ansible.builtin.file:
        src: "/tmp/{{ lookup('env', 'USER') }}_molecule"
        dest: /tmp/molecule_shared
        state: link
      delegate_to: localhost
      become: false
    - name: Ensure APT cache is up to date
      ansible.builtin.apt:
        update_cache: true
    - name: Install Docker CLI only (required for Ansible community.docker modules)
      ansible.builtin.apt:
        name: docker.io
        state: present
    - name: DEBUG bootstrap_project_path at prepare time
      ansible.builtin.debug:
        msg: "bootstrap_project_path={{ bootstrap_project_path }}"
    - name: Execute bootstrap role to create groups and directories
      ansible.builtin.include_role:
        name: bootstrap
    - name: Ensure shared directory exists on localhost
      ansible.builtin.file:
        path: /tmp/molecule_shared/wordpress_stack/angie/certs
        state: directory
        mode: '0777'
      delegate_to: localhost
      become: false
    - name: Install Docker CLI and Compose plugin (required for Ansible community.docker modules)
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
    - name: Generate a self-signed test CA certificate
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -newkey rsa:2048
          -keyout /tmp/step_ca_root.key
          -out /tmp/step_ca_root.crt
          -days 365 -nodes
          -subj "/CN=test-step-ca"
      changed_when: true
    - name: Validate generated test CA certificate
      ansible.builtin.command:
        cmd: openssl x509 -in /tmp/step_ca_root.crt -noout -subject -issuer
      changed_when: false
