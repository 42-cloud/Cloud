---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Allow all traffic on loopback interface
  community.general.ufw:
    rule: allow
    direction: in
    interface: lo

- name: Configure UFW defaults
  community.general.ufw:
    policy: deny
    direction: incoming

- name: Allow SSH, HTTP and HTTPS traffic
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "22"
    - "80"
    - "443"

- name: Enable and reload UFW
  community.general.ufw:
    state: enabled

- name: Create admin group
  ansible.builtin.group:
    name: admins
    state: present

- name: Create admin users
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: admins
    append: true
    state: present
  loop: "{{ bootstrap_admin_users_list }}"

- name: Configure sudoers for admin group
  ansible.builtin.copy:
    content: "%admins ALL=(ALL) NOPASSWD:ALL"
    dest: /etc/sudoers.d/admins-group
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Create persistent directories for db with mysql permission
  ansible.builtin.file:
    path: "{{ bootstrap_db_dir }}"
    state: directory
    owner: "{{ bootstrap_db_uid | int }}"
    group: "{{ bootstrap_db_gid | int }}"
    mode: "0700"

- name: Create persistent directories for wordpress with www-data permission
  ansible.builtin.file:
    path: "{{ bootstrap_wp_dir }}"
    state: directory
    owner: "{{ bootstrap_wp_uid | int }}"
    group: "{{ bootstrap_wp_gid | int }}"
    mode: "0755"

- name: Create configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: admins
    mode: "0775"
  loop:
    - "{{ bootstrap_project_path }}"
    - "{{ bootstrap_project_path }}/mariadb"
    - "{{ bootstrap_project_path }}/wordpress"
    - "{{ bootstrap_project_path }}/angie"
  become: true

# --- DUCK DNS ---
- name: Configure DuckDNS Automated Update Pipeline
  when:
    - bootstrap_duckdns_domain != ''
    - bootstrap_duckdns_token != ''
  block:
    - name: Execute DuckDNS API sync
      ansible.builtin.uri:
        url: >-
          {{ [
            bootstrap_duckdns_api_base,
            '/update?domains=',
            bootstrap_duckdns_domain | trim,
            '&token=',
            bootstrap_duckdns_token,
            '&ip='
          ] | join }}
        method: GET
        return_content: true
        validate_certs: true
      register: __bootstrap_duckdns_initial_sync
      when: bootstrap_duckdns_domain != 'test-domain'

    - name: Debug initial DuckDNS synchronization output
      ansible.builtin.debug:
        var: __bootstrap_duckdns_initial_sync.content

    - name: Mock DuckDNS output for Molecule testing environment
      ansible.builtin.set_fact:
        __bootstrap_duckdns_initial_sync:
          content: "OK"
          status: 200
      when: bootstrap_duckdns_domain == 'test-domain'

    - name: Remove obsolete DuckDNS cron jobs
      ansible.builtin.cron:
        name: "{{ item }}"
        state: absent
      loop:
        - "Sync AWS Elastic IP with DuckDNS"
        - "Sync AWS Elastic IP with DuckDNS at boot"

  rescue:
    - name: Handle DuckDNS configuration failure
      ansible.builtin.debug:
        msg: "DuckDNS configuration failed. Check tokens or network connection"
