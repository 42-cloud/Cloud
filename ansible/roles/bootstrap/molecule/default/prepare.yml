---
- name: Prepare instances
  hosts: all
  become: true
  tasks:
    - name: Ensure python 3 and pip are present
      ansible.builtin.apt:
        name: 
        - python3
        state: present
        update_cache: true
    
    - name: Deploy mock DuckDNS server script
      ansible.builtin.copy:
        src: mock_duckdns.py
        dest: /usr/local/bin/mock_duckdns.py
        mode: "0755"

    - name: Kill any stale mock process
      ansible.builtin.shell: pkill -f mock_duckdns.py || true
      changed_when: false
      failed_when: false

    - name: Deploy systemd unit file
      ansible.builtin.copy:
        dest: /etc/systemd/system/mock-duckdns.service
        mode: "0644"
        content: |
          [Unit]
          Description=Mock DuckDNS API Server for TDD
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/python3 /usr/local/bin/mock_duckdns.py
          Restart=on-failure
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target

    - name: Force systemd daemon reload and enable mock service
      ansible.builtin.systemd_service:
        name: mock-duckdns
        state: started
        enabled: true
        daemon_reload: true

    - name: Wait for Mock Server port 8081 to be fully ready
      ansible.builtin.wait_for:
        host: 0.0.0.0
        port: 8081
        timeout: 15
