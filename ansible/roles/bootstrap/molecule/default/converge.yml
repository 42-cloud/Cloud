---
- name: Converge Host Bootstrap
  hosts: all
  gather_facts: true
  roles:
    - role: bootstrap

  tasks:
  # - name: Diagnostic — Verify Mock Service Status
  #   ansible.builtin.command: systemctl status mock-duckdns
  #   register: __mock_service_status
  #   changed_when: false
  #   failed_when: false

  # - name: Diagnostic — Print Mock Service Status Logs
  #   ansible.builtin.debug:
  #     var: __mock_service_status.stdout_lines

    - name: Diagnostic — Verify Mock Process is Alive
      ansible.builtin.command: pgrep -f mock_duckdns.py
      register: __bootstrap_mock_process_check
      changed_when: false
      failed_when: false

    - name: Diagnostic — Print Running Mock PID
      ansible.builtin.debug:
        msg: "Mock server is running with PID: {{ __bootstrap_mock_process_check.stdout }}"
      when: __bootstrap_mock_process_check.rc == 0

    - name: Diagnostic — Fail Warn if Mock Process is Dead
      ansible.builtin.fail:
        msg: "CRITICAL: The background mock server process dropped before converge stage!"
      when: __bootstrap_mock_process_check.rc != 0

    - name: "Include bootstrap role"
      ansible.builtin.include_role:
        name: "bootstrap"
