---
- name: Verify Host Bootstrap
  hosts: all
  gather_facts: true

  tasks:
    - name: Load role default vars
      ansible.builtin.include_vars:
        file: "../../defaults/main.yml"

    - name: Load role vars
      ansible.builtin.include_vars:
        file: "../../vars/main.yml"

    - name: Check UFW service status
      ansible.builtin.command: ufw status verbose
      register: bootstrap_ufw_status
      changed_when: false

    - name: Print UFW status
      ansible.builtin.debug:
        var: bootstrap_ufw_status.stdout

    - name: Assert UFW is active and default policy is deny
      ansible.builtin.assert:
        that:
          - "'Status: active' in bootstrap_ufw_status.stdout"
          - "'Default: deny (incoming)' in bootstrap_ufw_status.stdout"

    - name: Assert ports 22 80 and 443 are allowed
      ansible.builtin.assert:
        that:
          - "'22/tcp' in bootstrap_ufw_status.stdout"
          - "'80/tcp' in bootstrap_ufw_status.stdout"
          - "'443/tcp' in bootstrap_ufw_status.stdout"

    # --- VERIFICATION USERS ---
    - name: Populate ansible_facts with group database
      ansible.builtin.getent:
        database: group

    - name: Assert admin group exists
      ansible.builtin.assert:
        that:
          - "'admins' in ansible_facts.getent_group"
        fail_msg: "The 'admins' group was not created"

    - name: Populate ansible_facts with passwd database
      ansible.builtin.getent:
        database: passwd

    - name: Ensure users args are member of admin group
      ansible.builtin.assert:
        that:
          - "item in ansible_facts.getent_passwd"
          - "item in ansible_facts.getent_group['admins'][2].split(',')"
        fail_msg: "User {{ item }} is missing or is not an admin"
      loop: "{{ bootstrap_admin_users_list }}"

    - name: Check sudo privileges for admin users
      ansible.builtin.command: "sudo -l -U {{ item }}"
      register: __bootstrap_sudo_privileges
      changed_when: false
      loop: "{{ bootstrap_admin_users_list }}"

    - name: Assert users have passwordless root privileges
      ansible.builtin.assert:
        that:
          - "'(ALL) NOPASSWD: ALL' in item.stdout"
        fail_msg: "L'utilisateur {{ item.item }} n'a pas les privilèges sudo requis (NOPASSWD: ALL)"
      loop: "{{ __bootstrap_sudo_privileges.results }}"

    # --- VERIFICATION WORDPRESS ---
    - name: Get WordPress storage directory details
      ansible.builtin.stat:
        path: "{{ bootstrap_wp_dir }}"
      register: bootstrap_wp_dir_res

    - name: Assert directory exists and has correct permissions for www-data
      ansible.builtin.assert:
        that:
          - bootstrap_wp_dir_res.stat.exists
          - bootstrap_wp_dir_res.stat.isdir
          - bootstrap_wp_dir_res.stat.uid == bootstrap_wp_uid | int
          - bootstrap_wp_dir_res.stat.gid == bootstrap_wp_gid | int
          - bootstrap_wp_dir_res.stat.mode == '0755'

    # --- VERIFICATION MARIADB ---
    - name: Get db storage directory details
      ansible.builtin.stat:
        path: "{{ bootstrap_db_dir }}"
      register: bootstrap_db_dir_res

    - name: Debug db directory facts
      ansible.builtin.debug:
        var: bootstrap_db_dir_res.stat

    - name: Assert directory exists and has correct permissions for mysql
      ansible.builtin.assert:
        that:
          - bootstrap_db_dir_res.stat.exists
          - bootstrap_db_dir_res.stat.isdir
          - bootstrap_db_dir_res.stat.uid == bootstrap_db_uid | int
          - bootstrap_db_dir_res.stat.gid == bootstrap_db_gid | int
          - bootstrap_db_dir_res.stat.mode == '0700'

    # --- VERIFICATION DIRS ---
    - name: Get conf directory details
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ bootstrap_project_path }}"
        - "{{ bootstrap_project_path }}/mariadb"
        - "{{ bootstrap_project_path }}/wordpress"
        - "{{ bootstrap_project_path }}/angie"
      register: __bootstrap_directories_stats

    - name: Assert config directorties exists and have correct permissions
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
          - item.stat.mode == '0775'
          - item.stat.gr_name == 'admins'
        fail_msg: "Missing config directory {{ item.item }}"
      loop: "{{ __bootstrap_directories_stats.results }}"

    # --- VERIFICATION DUCK DNS ---

    - name: Check mock server received a valid DuckDNS update call
      ansible.builtin.uri:
        url: "http://127.0.0.1:8081/update?domains=test-domain&token=test-token&ip="
        method: GET
        return_content: true
      register: __bootstrap_mock_check

    - name: Assert DuckDNS API call returned OK
      ansible.builtin.assert:
        that:
          - "__bootstrap_mock_check.content == 'OK'"
        fail_msg: >
          Returned by mock Duck DNS Server: '{{ __bootstrap_mock_check.content }}'  — incorrect params or unreachable

    - name: Read host crontab entries
      ansible.builtin.command: crontab -l
      register: __bootstrap_crontab
      changed_when: false

    - name: Assert DuckDNS update is configured for persistence
      ansible.builtin.assert:
        that:
          - "'Sync AWS Elastic IP with DuckDNS' in __bootstrap_crontab.stdout"
          - "'@reboot' in __bootstrap_crontab.stdout"
          - "'*/10' in __bootstrap_crontab.stdout"
          - "'test-token' in __bootstrap_crontab.stdout"
          - "'test-domain' in __bootstrap_crontab.stdout"
        fail_msg: "DuckDNS cron updates are misconfigured"

    - name: Assert mock server is still running
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8081
        timeout: 3
