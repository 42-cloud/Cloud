x-config: &config
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - NET_RAW
    - MKNOD
    - AUDIT_WRITE
    - SYS_CHROOT
    - SETPCAP
    - FSETID
  stdin_open: true
  tty: true

services:
  mariadb:
    <<: *config
    image: namichel/mariadb:12.2.2-amd64
    container_name: mariadb
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: "wordpress"
      MARIADB_PASSWORD_FILE: /run/secrets/mysql_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    volumes:
      - db_data:/var/lib/mysql
      - ./secrets/mysql_password:/run/secrets/mysql_password:ro
      - ./secrets/mysql_root_password:/run/secrets/mysql_root_password:ro
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
    healthcheck:
      test: ["CMD", "healthcheck-sql", "--host=localhost", "--user=wordpress", "--secret=/run/secrets/mysql_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudone-back

  wordpress:
    <<: *config
    image: namichel/wordpress:6.9.4-amd64
    container_name: wordpress
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: "wordpress"
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/wordpress_password
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WORDPRESS_HOME}');
        define('WP_SITEURL', '${WORDPRESS_SITEURL}');
    volumes:
      - wordpress_data:/var/www/html
      - ./secrets/wordpress_password:/run/secrets/wordpress_password:ro
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck-fcgi", "--addr=localhost:9000"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudone-front
      - cloudone-back

  angie:
    <<: *config
    image: namichel/angie:1.11.6-amd64
    container_name: angie
    ports:
      - "8080:8080"
    volumes:
      - ./angie.conf:/etc/angie/angie.conf:ro
    depends_on:
      wordpress:
        condition: service_healthy
      phpmyadmin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck-http", "--url=http://localhost:8080/status/"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64m
        reservations:
          memory: 32m
    networks:
      - cloudone-front
      - monitoring

  phpmyadmin:
    <<: *config
    image: namichel/phpmyadmin:5.2.2-amd64
    container_name: phpmyadmin
    environment:
      PMA_HOST: mariadb
    depends_on:
      mariadb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m
    healthcheck:
      test: ["CMD", "healthcheck-http", "--url=http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudone-front
      - cloudone-back

  grafana:
    <<: *config
    image: grafana/grafana:13.0.1
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    profiles:
      - monitoring
    depends_on:
      - prometheus
      # prometheus:
        # condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
    networks:
      - monitoring

  prometheus:
    <<: *config
    image: prom/prometheus:v3.11.3
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    profiles:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - angie
      # angie:
        # condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
    networks:
      - monitoring


networks:
  cloudone-front:
    driver: bridge
  cloudone-back:
    driver: bridge
  monitoring:
    driver: bridge

volumes:
  db_data:
  wordpress_data:
  prometheus_data:
  grafana_data:
