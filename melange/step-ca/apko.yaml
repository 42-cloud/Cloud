contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - https://Kazibuya.github.io/melange-forge/melange-ci.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - https://Kazibuya.github.io/melange-forge
  packages:
    - wolfi-baselayout
    - step-ca
    - step
    - busybox
    - ca-certificates-bundle

entrypoint:
  command: /usr/bin/step-ca

accounts:
  users:
    - username: step
      uid: 65532
  groups:
    - groupname: step
      gid: 65532
  run-as: "65532"

paths:
  - path: /home/step
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

archs:
  - amd64
