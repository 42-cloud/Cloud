contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - https://Kazibuya.github.io/melange-forge/melange-ci.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - https://Kazibuya.github.io/melange-forge
  packages:
    - wolfi-baselayout
    - mariadb-12.3
    - mariadb-12.3-client
    - mariadb-12.3-oci-entrypoint
    - healthcheck-sql
    - gosu
    - tzdata

entrypoint:
  command: /usr/local/bin/docker-entrypoint.sh mariadbd

accounts:
  users:
    - username: mysql
      uid: 70
  groups:
    - groupname: mysql
      gid: 70
  run-as: "70"

paths:
  - path: /var/lib/mysql
    type: directory
    uid: 70
    gid: 70
    permissions: 0o755
  - path: /run/mysqld
    type: directory
    uid: 70
    gid: 70
    permissions: 0o755
  - path: /docker-entrypoint-initdb.d
    type: directory
    uid: 70
    gid: 70
    permissions: 0o755

archs:
  - amd64
