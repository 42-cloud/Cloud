package:
  name: phpmyadmin
  version: "5.2.3"
  epoch: 0
  description: "phpMyAdmin web interface for MySQL/MariaDB"
  copyright:
    - license: GPL-2.0-only
  dependencies:
    runtime:
      - php-8.3
      - php-8.3-mbstring
      - php-8.3-pdo_mysql
      - php-8.3-curl
      - php-8.3-openssl
      - php-8.3-gd
      - php-8.3-intl
      - php-8.3-fileinfo
      - wolfi-baselayout

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - wolfi-baselayout
      - php
      - composer

pipeline:
  - uses: fetch
    with:
      uri: https://files.phpmyadmin.net/phpMyAdmin/${{package.version}}/phpMyAdmin-${{package.version}}-all-languages.tar.gz
      expected-sha256: 12ba1c425fa4071abbd4e7668c9ebdeac0b0755a467a6d6d5026122bb47c102b
  - runs: |
      tar -xzf phpMyAdmin-${{package.version}}-all-languages.tar.gz
      cd phpMyAdmin-${{package.version}}-all-languages
      composer update --no-interaction --no-dev --ignore-platform-reqs
      cd ..
      mkdir -p "${{targets.destdir}}/var/www/html"
      cp -r phpMyAdmin-${{package.version}}-all-languages/* \
        "${{targets.destdir}}/var/www/html/"
      cp "${{targets.destdir}}/var/www/html/config.sample.inc.php" \
         "${{targets.destdir}}/var/www/html/config.inc.php"
