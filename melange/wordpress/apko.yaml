contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - ./packages
    - ../healthcheck-http/packages
  packages:
    - wolfi-baselayout
    - wordpress
    - wordpress-oci-entrypoint
    - healthcheck-http
    - php-fpm

entrypoint:
  command: /usr/local/bin/docker-entrypoint.sh php-fpm

accounts:
  users:
    - username: nonroot
      uid: 65532
  groups:
    - groupname: nonroot
      gid: 65532
  run-as: "65532"

paths:
  - path: /var/www/html
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /usr/src/wordpress
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

archs:
  - amd64
