contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - https://Kazibuya.github.io/melange-forge/melange-ci.rsa.pub
    - ../melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - https://Kazibuya.github.io/melange-forge
    - ../packages
  packages:
    - busybox
    - wolfi-baselayout
    - wordpress
    - wordpress-oci-entrypoint
    - healthcheck-fcgi
    - php-8.4-fpm
    - php-8.4-mysqlnd
    - php-8.4-mysqli
    - php-8.4-gd
    - php-8.4-exif
    - php-8.4-dom
    - php-8.4-xml
    - php-8.4-xmlreader
    - wp-cli
    - mariadb-12.2-client

entrypoint:
  command: /usr/local/bin/docker-entrypoint.sh php-fpm

accounts:
  users:
    - username: nonroot
      uid: 65532
  groups:
    - groupname: nonroot
      gid: 65532

work-dir: /var/www/html

paths:
  - path: /var/www/html
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/www/html/wp-content
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/www/html/wp-content/plugins
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/www/html/wp-content/themes
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/www/html/wp-content/uploads
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /usr/src/wordpress
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/www/.wp-cli
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

archs:
  - amd64
