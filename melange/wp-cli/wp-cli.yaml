# wp-cli.yaml
package:
  name: wp-cli
  version: 2.12.0
  epoch: 0
  description: WP-CLI - command-line interface for WordPress
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - php
      - php-phar
      - php-curl
      - php-zip
      - php-xml
      - php-mbstring
      - bash

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - wget

pipeline:
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/local/bin"
      wget -O "${{targets.destdir}}/usr/local/bin/wp" \
        "https://github.com/wp-cli/wp-cli/releases/download/v${{package.version}}/wp-cli-${{package.version}}.phar"
      chmod +x "${{targets.destdir}}/usr/local/bin/wp"

update:
  enabled: true
  github:
    identifier: wp-cli/wp-cli
    strip-prefix: v